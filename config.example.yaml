provider: anthropic
model: claude-haiku-5-5
system_prompt: "Answer clearly and concisely. Follow any requested output format exactly."
prompt_template: |-
  {input}
generation:
  temperature: 1.0
  max_tokens: 256
  concurrency: 5
  retries: 3
  retry_backoff_seconds: 0.5
  timeout_seconds: 60
prices:
  input_per_token: 0.0
  output_per_token: 0.0
scorers:
  exact_match: true
  contains_text: true
  regex_match: true
  valid_json: true
  case_sensitive: false
  strip_whitespace: true
  regex_pattern: null
database: assay.sqlite3
