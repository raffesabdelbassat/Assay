# Pairwise comparison: model answers are judged head to head.
models:
  - provider: anthropic
    model: claude-haiku-5-5
  - provider: google
    model: gemini-3.8-flash

prompts:
  v1:
    system_prompt: "Answer clearly and concisely. Follow requested formats exactly."
    prompt_template: "{input}"

generation:
  temperature: 1.0
  max_tokens: 256
  concurrency: 5
  retries: 3
  retry_backoff_seconds: 0.5
  timeout_seconds: 60

judge:
  provider: openai
  model: gpt-5.5
  rubric_file: rubrics/summary-quality.md
  repeats: 3
  randomize_pair_order: true
  require_different_provider: true
  concurrency: 2
  retries: 2
  timeout_seconds: 60

pairwise: true
prices_file: prices.example.yaml
database: assay.sqlite3
